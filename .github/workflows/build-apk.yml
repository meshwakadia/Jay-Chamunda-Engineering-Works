name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/*.apk /tmp/JCEW-Bill.apk
          cp /tmp/JCEW-Bill.apk JCEW-Bill.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JCEW-Bill-APK
          path: JCEW-Bill.apk
          if-no-files-found: error

      - name: Publish to apk branch for direct download
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-branch
          git rm -rf .
          cp /tmp/JCEW-Bill.apk JCEW-Bill.apk
          git add JCEW-Bill.apk
          git commit -m "Update downloadable APK"
          git push -f origin apk-branch:apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.1
          name: "JCEW Bill v1.1"
          body: "Direct APK download for JCEW Bill Android app with Digital Signature, Image Stamp upload, and permanent Logo fix."
          files: /tmp/JCEW-Bill.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
